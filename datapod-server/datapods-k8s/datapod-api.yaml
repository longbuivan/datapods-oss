apiVersion: apps/v1
kind: Deployment
metadata:
  name: datapod-api
  namespace: analytics-project
  labels:
    app: datapod-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datapod-api
  template:
    metadata:
      labels:
        app: datapod-api
    spec:
      containers:
        - name: datapod-api
          image: datapod-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MAGE_PROJECT_PATH
              value: /mage_project
            - name: MAGE_URL
              value: http://mage-server:6789
            - name: DATAPODS_STORE
              value: /app/data/datapods.json
            - name: AI_BASE_URL
              value: https://api.openai.com/v1
            - name: AI_MODEL
              value: gpt-4o-mini
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datapod-ai
                  key: api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: mage-project
              mountPath: /mage_project
            - name: api-data
              mountPath: /app/data
      volumes:
        - name: mage-project
          emptyDir: {}
        - name: api-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: datapod-api
  namespace: analytics-project
spec:
  selector:
    app: datapod-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
